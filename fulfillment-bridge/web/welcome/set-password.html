<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>Set your password — DenialsDoctor</title>
<style>
:root{--bg:#09090b;--card:#131316;--border:#26262b;--green:#10b981;--red:#ef4444;--text:#fafafa;--muted:#a1a1aa;--dim:#71717a}
*{margin:0;padding:0;box-sizing:border-box}
body{background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px}
.card{background:var(--card);border:1px solid var(--border);border-radius:16px;padding:36px;width:100%;max-width:440px}
.logo{font-weight:800;font-size:19px;margin-bottom:20px}.logo b{color:var(--green)}
h2{font-size:20px;margin-bottom:6px}
.sub{color:var(--muted);font-size:14px;margin-bottom:24px;line-height:1.5}
label{display:block;font-size:13px;font-weight:600;color:var(--muted);margin:14px 0 6px}
input{width:100%;padding:12px 14px;background:#0d0d10;border:1px solid var(--border);border-radius:10px;color:var(--text);font-size:15px;outline:none}
input:focus{border-color:rgba(16,185,129,.5)}
button{width:100%;margin-top:20px;padding:13px;background:linear-gradient(135deg,#10b981,#059669);color:#fff;border:0;border-radius:10px;font-weight:700;font-size:15px;cursor:pointer}
button:disabled{opacity:.5;cursor:not-allowed}
.msg{margin-top:16px;padding:12px 14px;border-radius:10px;font-size:14px;display:none}
.msg.ok{background:rgba(16,185,129,.08);border:1px solid rgba(16,185,129,.3);color:var(--green);display:block}
.msg.err{background:rgba(239,68,68,.08);border:1px solid rgba(239,68,68,.3);color:#fca5a5;display:block}
.badge{display:inline-block;font-size:12px;padding:3px 10px;border-radius:999px;background:rgba(16,185,129,.1);color:var(--green);border:1px solid rgba(16,185,129,.3);margin-bottom:14px}
a{color:var(--green)}
.foot{margin-top:22px;color:var(--dim);font-size:12.5px;text-align:center}
.hint{color:var(--dim);font-size:12px;margin-top:6px}
</style>
</head>
<body>
<div class="card">
  <div class="logo">Denials<b>Doctor</b></div>
  <div id="state" class="badge">Checking your link&hellip;</div>
  <h2>Set your password</h2>
  <p class="sub" id="sub">Loading&hellip;</p>

  <form id="form" style="display:none" onsubmit="return submitPwd(event)">
    <label for="p1">New password</label>
    <input id="p1" type="password" minlength="10" autocomplete="new-password" required placeholder="At least 10 characters"/>
    <label for="p2">Confirm password</label>
    <input id="p2" type="password" minlength="10" autocomplete="new-password" required placeholder="Same password again"/>
    <p class="hint" id="mismatch" style="color:#fca5a5;display:none">Passwords don't match.</p>
    <button id="btn" type="submit">Set my password</button>
  </form>

  <div class="msg" id="msg"></div>

  <div class="foot" id="foot" style="display:none">Password set &mdash; <a href="/login">go to sign in &rarr;</a></div>
  <div class="foot">Stuck? Email <a href="mailto:rajesh@ariaagent.agency">rajesh@ariaagent.agency</a></div>
</div>

<script>
const API = "https://api.denialsdoctor.com";
const token = new URLSearchParams(location.search).get("token") || "";

function show(el, cls, text){ el.className = "msg " + cls; el.textContent = text; }

(async function init(){
  const badge = document.getElementById("state");
  const sub = document.getElementById("sub");
  const form = document.getElementById("form");
  const msg = document.getElementById("msg");
  if (!token){ badge.textContent = "Link missing"; show(msg, "err", "This page needs the link from your welcome email. Please open the exact link you received."); return; }
  try{
    const r = await fetch(API + "/auth/set-password/verify?token=" + encodeURIComponent(token));
    const d = await r.json();
    if (d.valid){
      badge.textContent = "Link verified";
      sub.innerHTML = "Setting the password for <b>" + (d.email||"your account") + "</b>. Choose something you don't use elsewhere.";
      form.style.display = "block";
    } else {
      badge.textContent = "Link invalid";
      sub.textContent = "We couldn't validate this link.";
      show(msg, "err", "This link is invalid, already used, or expired (links last 24 hours). Email rajesh@ariaagent.agency and we'll send a fresh one in minutes.");
    }
  }catch(e){
    badge.textContent = "Connection problem";
    show(msg, "err", "Couldn't reach the server. Try again in a minute, or email rajesh@ariaagent.agency.");
  }
})();

async function submitPwd(ev){
  ev.preventDefault();
  const p1 = document.getElementById("p1").value, p2 = document.getElementById("p2").value;
  const msg = document.getElementById("msg"), mm = document.getElementById("mismatch"), btn = document.getElementById("btn");
  if (p1 !== p2){ mm.style.display = "block"; return false; }
  mm.style.display = "none";
  if (p1.length < 10){ show(msg, "err", "Password must be at least 10 characters."); return false; }
  btn.disabled = true; btn.textContent = "Setting\u2026";
  try{
    const r = await fetch(API + "/auth/set-password", {
      method: "POST",
      headers: {"Content-Type": "application/json"},
      body: JSON.stringify({token: token, password: p1})
    });
    const d = await r.json().catch(()=>({}));
    if (r.ok){
      document.getElementById("form").style.display = "none";
      document.getElementById("state").textContent = "Done";
      document.getElementById("sub").textContent = "Your password is set. Your workspace was ready and waiting — sign in now and run your first denial.";
      document.getElementById("foot").style.display = "block";
    } else {
      show(msg, "err", (d.detail || "Couldn't set the password.").toString());
      btn.disabled = false; btn.textContent = "Set my password";
    }
  }catch(e){
    show(msg, "err", "Network error — try again.");
    btn.disabled = false; btn.textContent = "Set my password";
  }
  return false;
}
</script>
</body>
</html>
