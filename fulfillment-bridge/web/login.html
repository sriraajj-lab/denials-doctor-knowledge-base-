<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>Sign in — DenialsDoctor</title>
<style>
:root{--bg:#09090b;--card:#131316;--border:#26262b;--green:#10b981;--text:#fafafa;--muted:#a1a1aa;--dim:#71717a}
*{margin:0;padding:0;box-sizing:border-box}
body{background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px}
.card{background:var(--card);border:1px solid var(--border);border-radius:16px;padding:36px;width:100%;max-width:440px}
.logo{font-weight:800;font-size:19px;margin-bottom:20px}.logo b{color:var(--green)}
h2{font-size:20px;margin-bottom:6px}
.sub{color:var(--muted);font-size:14px;margin-bottom:24px}
label{display:block;font-size:13px;font-weight:600;color:var(--muted);margin:14px 0 6px}
input{width:100%;padding:12px 14px;background:#0d0d10;border:1px solid var(--border);border-radius:10px;color:var(--text);font-size:15px;outline:none}
input:focus{border-color:rgba(16,185,129,.5)}
button{width:100%;margin-top:20px;padding:13px;background:linear-gradient(135deg,#10b981,#059669);color:#fff;border:0;border-radius:10px;font-weight:700;font-size:15px;cursor:pointer}
button:disabled{opacity:.5;cursor:not-allowed}
.msg{margin-top:16px;padding:12px 14px;border-radius:10px;font-size:14px;display:none}
.msg.err{background:rgba(239,68,68,.08);border:1px solid rgba(239,68,68,.3);color:#fca5a5;display:block}
a{color:var(--green)}
.foot{margin-top:20px;color:var(--dim);font-size:12.5px;text-align:center;line-height:1.7}
</style>
</head>
<body>
<div class="card">
  <div class="logo">Denials<b>Doctor</b></div>
  <h2>Sign in to your workspace</h2>
  <p class="sub">Use the email you subscribed with.</p>
  <form onsubmit="return doLogin(event)">
    <label for="em">Email</label>
    <input id="em" type="email" required autocomplete="email" placeholder="you@practice.com"/>
    <label for="pw">Password</label>
    <input id="pw" type="password" required autocomplete="current-password" placeholder="Your password"/>
    <button id="btn" type="submit">Sign in</button>
  </form>
  <div class="msg" id="msg"></div>
  <div class="foot">
    Haven't set a password yet? Check your welcome email for the one-time link, or email <a href="mailto:rajesh@ariaagent.agency">rajesh@ariaagent.agency</a>.<br/>
    <a href="/welcome">Subscription help &rarr;</a>
  </div>
</div>

<script>
const API = "https://api.denialsdoctor.com";
async function doLogin(ev){
  ev.preventDefault();
  const msg = document.getElementById("msg"), btn = document.getElementById("btn");
  const email = document.getElementById("em").value.trim();
  const password = document.getElementById("pw").value;
  btn.disabled = true; btn.textContent = "Signing in\u2026";
  try{
    const r = await fetch(API + "/auth/login", {
      method: "POST",
      headers: {"Content-Type": "application/json"},
      body: JSON.stringify({email: email, password: password})
    });
    const d = await r.json().catch(()=>({}));
    if (r.ok && d.token){
      sessionStorage.setItem("dd_token", d.token);
      sessionStorage.setItem("dd_email", d.email || email);
      sessionStorage.setItem("dd_role", d.role || "");
      location.href = "/app";
    } else {
      let detail = (d.detail || "Invalid email or password.").toString();
      if (r.status === 403 && /deactivated|suspended/i.test(detail)) detail = detail + " Email rajesh@ariaagent.agency if you believe this is a mistake.";
      msg.className = "msg err"; msg.textContent = detail;
      btn.disabled = false; btn.textContent = "Sign in";
    }
  }catch(e){
    msg.className = "msg err"; msg.textContent = "Network error — try again in a minute.";
    btn.disabled = false; btn.textContent = "Sign in";
  }
  return false;
}
</script>
</body>
</html>
